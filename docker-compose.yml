version: '3.8'

services:
  app-server:
    image: ubuntu:22.04
    container_name: devops-app-container
    restart: always
    command: bash -c "echo 'Persistent Log Data' >> /app/data/app.log && sleep infinity"
    volumes:
      - app-data:/app/data

  database:
    image: redis:alpine
    container_name: devops-redis-db
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

volumes:
  app-data:
    driver: local
  redis-data:
    driver: local
