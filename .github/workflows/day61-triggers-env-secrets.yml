name: Day 61 - Triggers, Env & Secrets

on:
  push:
    branches:
      - main
    paths:
      - 'day-61/**'
      - '.github/workflows/day61-triggers-env-secrets.yml'
  workflow_dispatch:

env:
  PROJECT_NAME: "150-Days-Of-DevOps"
  ENVIRONMENT: "staging"

jobs:
  configure-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Show environment variables
        env:
          STEP_OWNER: "DevOps-Engineer"
        run: |
          echo "Project: $PROJECT_NAME"
          echo "Environment: $ENVIRONMENT"
          echo "Step Owner: $STEP_OWNER"

      - name: Verify secret masking
        env:
          DEMO_SECRET_TOKEN: ${{ secrets.DAY61_DEMO_TOKEN }}
        run: |
          if [ -n "$DEMO_SECRET_TOKEN" ]; then
            echo "Secret is configured! Value in logs: $DEMO_SECRET_TOKEN"
          else
            echo "Secret DAY61_DEMO_TOKEN is not set yet (safe fallback)."
          fi
