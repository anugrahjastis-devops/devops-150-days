name: Day 19 - Secrets & Artifacts CI

on:
  push:
    branches: [ "main" ]

jobs:
  secure-build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Generate Audit Logs with Masked Secrets
      env:
        DB_PASS: ${{ secrets.DB_PASSWORD }}
      run: |
        mkdir -p build_output
        echo "=== DEV-OPS DAY 19 AUDIT REPORT ===" > build_output/audit_report.txt
        echo "Generated At: $(date)" >> build_output/audit_report.txt
        echo "Database Authentication Check Completed." >> build_output/audit_report.txt
        echo "Testing secret mask in terminal logs..."
        echo "Database password retrieved successfully: $DB_PASS"

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v3
      with:
        name: day19-audit-logs
        path: build_output/audit_report.txt
