name: Day 25 - Secret Management and Environment Variables

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

# Workflow-level Environment Variables
env:
  PIPELINE_ENV: "Production"
  APP_VERSION: "v1.2.5"

jobs:
  secrets-and-env-job:
    name: Test Secrets and Env Vars
    runs-on: self-hosted

    # Job-level Environment Variables
    env:
      BUILD_MODE: "Release"

    steps:
      - name: Print Environment Variables
        run: |
          echo "=============================================="
          echo "🚀 TESTING ENVIRONMENT VARIABLES 🚀"
          echo "Pipeline Environment: $PIPELINE_ENV"
          echo "App Version: $APP_VERSION"
          echo "Build Mode: $BUILD_MODE"
          echo "=============================================="

      - name: Test Secret Injection (Masked output)
        env:
          API_KEY_SECRET: ${{ secrets.MY_API_KEY }}
        run: |
          echo "=============================================="
          echo "🔐 TESTING SECRETS MANAGEMENT 🔐"
          echo "Fetching Secret from GitHub Settings..."
          # GitHub Actions automatically masks secret values in logs!
          echo "API Secret Key Loaded Successfully!"
          echo "=============================================="
