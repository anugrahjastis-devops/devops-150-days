name: Day 62 - Multi-Job Dependencies, Artifacts & Caching

on:
  push:
    branches:
      - main
    paths:
      - 'day-62/**'
      - '.github/workflows/day62-artifacts-caching-needs.yml'
  workflow_dispatch:

jobs:
  build-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Restore or create build cache
        id: build-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/day62-demo
          key: day62-cache-${{ runner.os }}-${{ hashFiles('day-62/**') }}

      - name: Prepare cached data and generate build artifact
        run: |
          mkdir -p ~/.cache/day62-demo dist
          echo "Cached dependency metadata - Day 62" > ~/.cache/day62-demo/deps.txt
          echo "Build Version: 1.0.${{ github.run_number }}" > dist/build-info.txt
          echo "Commit SHA: ${{ github.sha }}" >> dist/build-info.txt
          echo "Status: READY_FOR_VERIFICATION" >> dist/build-info.txt
          cat dist/build-info.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: day62-build-bundle
          path: dist/build-info.txt
          retention-days: 5

  verify-artifact:
    runs-on: ubuntu-latest
    needs: build-and-package
    steps:
      - name: Download build artifact from Job 1
        uses: actions/download-artifact@v4
        with:
          name: day62-build-bundle
          path: downloaded-dist

      - name: Verify downloaded artifact contents
        run: |
          echo "Files inside downloaded-dist:"
          ls -la downloaded-dist
          cat downloaded-dist/build-info.txt
          grep -q "READY_FOR_VERIFICATION" downloaded-dist/build-info.txt
          echo "Artifact verification passed successfully!"
