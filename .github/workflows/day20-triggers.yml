name: Day 20 - Advanced Triggers & Event Filters

on:
  push:
    branches: [ "main" ]
    paths:
      - '.github/workflows/**'
      - 'Day-15/**'
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target Deployment Environment'
        required: true
        default: 'staging'
        type: choice
        options:
        - staging
        - production

jobs:
  trigger-validation:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Display Trigger Metadata
      run: |
        echo "=== DAY 20 WORKFLOW TRIGGER METADATA ==="
        echo "Event Name: ${{ github.event_name }}"
        echo "Triggered By: ${{ github.actor }}"
        echo "Target Branch: ${{ github.ref }}"
        
    - name: Handle Manual Dispatch Inputs
      if: github.event_name == 'workflow_dispatch'
      run: |
        echo "Manual Trigger Activated!"
        echo "Selected Environment: ${{ inputs.environment }}"
