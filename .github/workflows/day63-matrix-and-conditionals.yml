name: Day 63 - Matrix Strategy & Conditional Steps

on:
  push:
    branches:
      - main
    paths:
      - 'day-63/**'
      - '.github/workflows/day63-matrix-and-conditionals.yml'
  workflow_dispatch:

jobs:
  matrix-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, staging, prod]
        runtime-version: ['3.10', '3.12']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Display matrix combination
        run: |
          echo "Testing Environment: ${{ matrix.environment }}"
          echo "Runtime Version: ${{ matrix.runtime-version }}"

      - name: Run simulated checks
        run: |
          echo "Running validation suite for ${{ matrix.environment }} on v${{ matrix.runtime-version }}..."
          sleep 1
          echo "Validation passed!"

      - name: Production-only security audit (Conditional)
        if: matrix.environment == 'prod'
        run: |
          echo "Running extra security & compliance audit ONLY for PROD (v${{ matrix.runtime-version }})!"
          echo "Prod audit passed!"

  pipeline-summary:
    runs-on: ubuntu-latest
    needs: matrix-test
    steps:
      - name: Confirm all 6 matrix jobs passed
        run: |
          echo "All 3 environments x 2 runtime versions (6 parallel jobs) completed successfully!"
